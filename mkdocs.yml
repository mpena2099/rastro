site_name: Rastro
site_description: Anãs marrons próximas ao Sol pelo movimento próprio no CatWISE2020
site_url: https://mpena2099.github.io/rastro/
repo_url: https://github.com/mpena2099/rastro
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Instalar sem terminal: instalar.md
  - Começar: comecar.md
  - Como funciona: como-funciona.md
  - Revisão e treino: revisao.md
  - Relatório e segunda opinião: relatorio.md
  - Resultados: resultados.md
  - Créditos: creditos.md
