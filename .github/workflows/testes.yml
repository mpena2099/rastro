name: testes

on:
  push:
  pull_request:

jobs:
  lint:
    # um so sistema e uma versao: o lint nao muda com a matriz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # B905 (zip sem strict=) fica de fora: mudaria comportamento sem ganho
      - run: ruff check --select F,B,E9 --ignore B905 --exclude venv .

  unidade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 e o ambiente local; 3.13 e o da demo no Streamlit Community Cloud
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      # testes offline: a Fase 1 (sanity check) depende de rede e fica fora do CI
      - run: python -W ignore tests/test_units.py
